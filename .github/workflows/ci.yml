name: CI

on:
  # Every pull request, whatever its base, so a branch stacked on another is
  # checked before it merges into that branch rather than only once the stack
  # reaches main. The three checks this workflow provides are the ones the
  # ruleset requires on the default branch; a base-branch filter added here
  # must keep matching it, or every pull request into it becomes unmergeable —
  # including the one that would correct the filter.
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Whether this pull request changes only documentation: Markdown, and the
  # images under docs/. If it does, nothing the build, typecheck, tests or
  # Compose check read has changed, so those are skipped and only the
  # documentation checks run.
  #
  # The jobs below run unless this reports exactly "true". A classification
  # that fails, or never answers, therefore means the full run. That ordering
  # matters: a job whose `needs` failed is skipped by default, and a skipped job
  # satisfies a required check, so without `!cancelled()` on each of them a
  # crash here would turn the whole run green.
  # ---------------------------------------------------------------------------
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      # Full history, so the merge base of the two commits below is present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Three dots: what this pull request changes since it left its base, not
      # everything the base has gained since. Without rename detection, a file
      # moved from code to Markdown is listed under both names, and the old one
      # keeps it a code change.
      - name: Classify the changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | node scripts/classify-changes.mjs

  # Static checks + build. Runs in parallel with the `test` job below.
  checks:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    needs: changes
    # Always runs: its documentation steps are the ones a documentation-only
    # pull request is checked by.
    if: ${{ !cancelled() }}

    # resolve-provider.mjs and the build read DATABASE_URL; SQLite is the
    # committed default, so a file: URL is enough here. The generated Prisma
    # client lives in /generated/ (gitignored), so it must be generated in CI.
    env:
      DATABASE_URL: "file:./data/app.db"
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # First, and before `npm ci` spends a minute installing against the wrong
      # runtime. --with-image runs `node -v` inside the base image the Dockerfile
      # names, so this compares two Node processes that really started rather
      # than two strings read out of two files. The script needs no dependencies.
      - name: Check the Node version pins agree
        if: env.DOCS_ONLY != 'true'
        run: npm run check:node -- --with-image

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        if: env.DOCS_ONLY != 'true'
        run: npm run db:generate

      - name: Lint
        if: env.DOCS_ONLY != 'true'
        run: npm run lint

      # Blocking, not continue-on-error. A check that can fail without
      # consequence becomes a red X nobody acts on, and real failures then hide
      # behind the noise — either it gates or it is not worth running.
      - name: Lint markdown
        run: npm run lint:md

      - name: Check for Acceptance-Criteria references
        run: npm run check:ac

      - name: Check for issue references in comments
        run: npm run check:comments

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        if: env.DOCS_ONLY != 'true'
        run: npm run typecheck

      - name: Build
        if: env.DOCS_ONLY != 'true'
        run: npm run build

  # Unit, integration and component tests, via the reusable workflow publish.yml
  # also gates on, so the tests are not written out twice.
  test:
    name: Tests
    needs: changes
    # Always called; a documentation-only run is skipped inside _test.yml, which
    # explains why it cannot be skipped here.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_test.yml
    with:
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}

  # Packaging config. Needs no Node toolchain, so it is its own job rather than
  # a step queued behind `npm ci` in `checks`.
  compose:
    name: Compose Files
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}

    steps:
      - uses: actions/checkout@v4

      # Both files declare `env_file: .env`, which is gitignored, and both fail
      # fast on an unset secret — so on a clean checkout `config` errors before
      # it parses anything. Copying the template is the first step of the
      # documented quick-start anyway, which makes this stricter than a syntax
      # check: it also proves .env.example still carries every variable the
      # compose files reference.
      - name: Create .env from the template
        run: cp .env.example .env

      # Parses, interpolates and validates against the Compose spec without
      # building or pulling anything. The prod file is not an override of the
      # base one, so it has to be validated on its own.
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q

  # ---------------------------------------------------------------------------
  # Definition of Done — the CI-owned boxes on whatever issues this PR closes.
  #
  # These two jobs bracket the run: `dod-reset` clears the boxes before anything
  # is proven, `dod-update` ticks the ones that passed. If the run is cancelled
  # or dies in between, the boxes stay clear — the fail-safe direction is
  # "unproven", never "passed".
  #
  # Both carry the same concurrency group so two runs cannot write at once. That
  # alone does not prevent a stale write: a job still waiting on its needs is not
  # yet in the group, so an older run's update can be pending while a newer run
  # resets. The script therefore re-checks the pull request head before writing
  # and skips if the run is no longer current.
  # ---------------------------------------------------------------------------

  dod-reset:
    name: DoD — clear
    runs-on: ubuntu-latest
    # Only this job and dod-update touch the API; the rest of the workflow keeps
    # the read-only default declared at the top of the file.
    permissions:
      contents: read
      # Resolving which issues a pull request closes reads the pull request
      # itself; an explicit permissions block replaces the defaults, so this has
      # to be granted even though nothing here writes to the pull request.
      pull-requests: read
      issues: write
    concurrency:
      group: dod-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - name: Clear the CI-owned boxes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/update-dod.mjs --reset

  dod-update:
    name: DoD — record results
    runs-on: ubuntu-latest
    needs: [changes, checks, test, compose, dod-reset]
    # `always()` so a failing job still gets recorded as a cleared box rather
    # than leaving whatever the previous run wrote.
    if: always()
    permissions:
      contents: read
      # Resolving which issues a pull request closes reads the pull request
      # itself; an explicit permissions block replaces the defaults, so this has
      # to be granted even though nothing here writes to the pull request.
      pull-requests: read
      issues: write
    concurrency:
      group: dod-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      # --docs-only lets a job skipped for a documentation-only change tick its
      # box. It is passed through as the classifier wrote it; the script counts
      # only an exact "true", so a failed classification ticks nothing extra.
      - name: Record which checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/update-dod.mjs \
            --results=checks:${{ needs.checks.result }},test:${{ needs.test.result }},compose:${{ needs.compose.result }} \
            --docs-only=${{ needs.changes.outputs.docs_only }}
