name: CI

on:
  pull_request:
    branches: [production, develop]

permissions:
  contents: read

jobs:
  # Static checks + build. Runs in parallel with the `test` job below.
  checks:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    # resolve-provider.mjs and the build read DATABASE_URL; SQLite is the
    # committed default, so a file: URL is enough here. The generated Prisma
    # client lives in /generated/ (gitignored), so it must be generated in CI.
    env:
      DATABASE_URL: "file:./data/app.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Check for Acceptance-Criteria references
        run: npm run check:ac

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Unit + integration tests, via the reusable workflow the deploy pipelines
  # will also gate on (Phase 6). Kept separate so tests aren't re-authored there.
  test:
    name: Tests
    uses: ./.github/workflows/_test.yml

  # Packaging config. Needs no Node toolchain, so it is its own job rather than
  # a step queued behind `npm ci` in `checks`.
  compose:
    name: Compose Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Both files declare `env_file: .env`, which is gitignored, and both fail
      # fast on an unset secret — so on a clean checkout `config` errors before
      # it parses anything. Copying the template is the first step of the
      # documented quick-start anyway, which makes this stricter than a syntax
      # check: it also proves .env.example still carries every variable the
      # compose files reference.
      - name: Create .env from the template
        run: cp .env.example .env

      # Parses, interpolates and validates against the Compose spec without
      # building or pulling anything. The prod file is not an override of the
      # base one, so it has to be validated on its own.
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q

  # ---------------------------------------------------------------------------
  # Definition of Done — the CI-owned boxes on whatever issues this PR closes.
  #
  # These two jobs bracket the run: `dod-reset` clears the boxes before anything
  # is proven, `dod-update` ticks the ones that passed. If the run is cancelled
  # or dies in between, the boxes stay clear — the fail-safe direction is
  # "unproven", never "passed".
  #
  # Both carry the same concurrency group so two runs cannot write at once. That
  # alone does not prevent a stale write: a job still waiting on its needs is not
  # yet in the group, so an older run's update can be pending while a newer run
  # resets. The script therefore re-checks the pull request head before writing
  # and skips if the run is no longer current.
  # ---------------------------------------------------------------------------

  dod-reset:
    name: DoD — clear
    runs-on: ubuntu-latest
    # Only this job and dod-update touch the API; the rest of the workflow keeps
    # the read-only default declared at the top of the file.
    permissions:
      contents: read
      # Resolving which issues a pull request closes reads the pull request
      # itself; an explicit permissions block replaces the defaults, so this has
      # to be granted even though nothing here writes to the pull request.
      pull-requests: read
      issues: write
    concurrency:
      group: dod-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - name: Clear the CI-owned boxes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/update-dod.mjs --reset

  dod-update:
    name: DoD — record results
    runs-on: ubuntu-latest
    needs: [checks, test, compose, dod-reset]
    # `always()` so a failing job still gets recorded as a cleared box rather
    # than leaving whatever the previous run wrote.
    if: always()
    permissions:
      contents: read
      # Resolving which issues a pull request closes reads the pull request
      # itself; an explicit permissions block replaces the defaults, so this has
      # to be granted even though nothing here writes to the pull request.
      pull-requests: read
      issues: write
    concurrency:
      group: dod-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - name: Record which checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/update-dod.mjs \
            --results=checks:${{ needs.checks.result }},test:${{ needs.test.result }},compose:${{ needs.compose.result }}
