name: CI

on:
  pull_request:
    branches: [production, develop]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    # The generated Prisma client lives in /generated/ (gitignored), so it must
    # be generated in CI. resolve-provider.mjs and the build read DATABASE_URL;
    # SQLite is the committed default, so a file: URL is enough here.
    env:
      DATABASE_URL: "file:./data/app.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Check for Acceptance-Criteria references
        run: npm run check:ac

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
