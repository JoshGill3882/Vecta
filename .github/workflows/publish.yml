name: Publish

# Builds the Docker image and publishes it to GHCR.
#
# Two publishing triggers, plus a third that publishes nothing:
#
#   push to develop  -> :unstable and :develop-<sha>. Rolling dev builds,
#                       overwritten freely.
#   push of a v* tag -> the exact version, e.g. :v0.1.0-rc1. Git tags are
#                       immutable, so a published version tag is never rebuilt
#                       over — that is what makes "upgrade from v0.x" mean one
#                       specific set of bits.
#   workflow_dispatch -> a dry run. Computes the tag set for a simulated version
#                       and reports it, without building or pushing anything.
#
# `production` is deliberately not a trigger. Releases are cut by tagging it
# after develop merges in; production is the CI-green branch, not a publish
# event. Deriving the release from an immutable tag rather than a branch push
# is what stops a second push republishing an already-released version with
# different bits.
#
# ── Why this is three jobs rather than one ───────────────────────────────────
# Each architecture builds on a runner of its own architecture, and a final job
# stitches the results into one multi-arch index.
#
# The alternative — one runner emulating the other architecture through QEMU —
# was measurably worse. `better-sqlite3` publishes prebuilt binaries, so amd64
# installs its dependencies in about thirty seconds; there is no prebuild for
# arm64 on musl, so Alpine falls through to `node-gyp rebuild` and compiles the
# SQLite amalgamation from source. Under emulation that took upwards of forty
# minutes and produced no output while it ran, which is indistinguishable from
# a hung build. Native runners for both halves remove the emulation entirely.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      simulate_version:
        description: "Dry run: version to compute the tag set for (e.g. v0.1.0 or v0.1.0-rc1). Nothing is built or pushed."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Superseding a develop build is fine — the next one publishes the same
  # moving tags. Never cancel a tag build: a half-published release is worse
  # than a wasted runner, and the tag cannot be pushed again to retry.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The gate `_test.yml` was written for. A dry run publishes nothing, so it has
  # no reason to wait for the suite.
  test:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/_test.yml

  # ── Tag rules ──────────────────────────────────────────────────────────────
  # Resolved once, in a job of its own, so both build legs and the merge agree
  # on the same answer. Recomputing per job would let them drift.
  meta:
    name: Resolve tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ctx.outputs.version }}
      release: ${{ steps.ctx.outputs.release }}
      image: ${{ steps.ctx.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
      meta_version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # Resolved in shell so the dry run and a real publish share exactly the
      # same logic. Deriving `latest` from metadata-action's `flavor: latest=auto`
      # instead would key off the *event* being a tag push, which a
      # workflow_dispatch never is — the dry run would then take a different code
      # path from the thing it claims to verify.
      #
      # Inputs arrive through env rather than ${{ }} interpolation: a value
      # substituted straight into a run block is pasted in as shell source, so a
      # crafted input would execute. Through env it is only ever data.
      - name: Resolve version and image name
        id: ctx
        env:
          SIMULATED: ${{ inputs.simulate_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "$SIMULATED" ]; then
            version="$SIMULATED"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version=""
          fi

          # A release is a v* version with no prerelease suffix. Semver puts
          # prereleases after a hyphen, so that hyphen is the whole test:
          # v0.1.0-rc1 is excluded, v0.1.0 is not. An rc must never land on the
          # tag self-hosters pull.
          release=false
          case "$version" in
            v*-*) ;;
            v*) release=true ;;
          esac

          # GHCR rejects uppercase in a repository path, and this owner and repo
          # both carry capitals.
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          {
            echo "version=$version"
            echo "release=$release"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Annotations are emitted for the index rather than the manifest,
          # because the merge step below is what applies them and it writes the
          # index. The GHCR sidebar reads the index, so this is also what makes
          # the package page show anything.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.ctx.outputs.image }}
          # `latest` is handled by an explicit rule below instead.
          flavor: latest=false
          # type=raw throughout rather than type=semver: semver's default
          # pattern strips the leading v, and its major/minor rollups (:v0,
          # :v0.1) would be extra moving tags this project has not promised to
          # maintain. Raw publishes exactly the version that was tagged.
          tags: |
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=develop-,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.ctx.outputs.release == 'true' }}

      # ── Dry run ends here ────────────────────────────────────────────────────
      - name: Report the computed tag set
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.ctx.outputs.version }}
          RELEASE: ${{ steps.ctx.outputs.release }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run — \`$VERSION\`"
            echo
            echo "Treated as a release (moves \`:latest\`): **$RELEASE**"
            echo
            echo "Tags that would be published:"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo
            echo "_Nothing was built or pushed._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Per-architecture builds ────────────────────────────────────────────────
  # Each leg pushes by digest with no tags attached. Nothing is publicly
  # addressable until the merge job creates the index, so a half-finished build
  # cannot leave a tag pointing at a single-architecture image.
  build:
    name: Build ${{ matrix.arch }}
    needs: [test, meta]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # Both results are wanted even when one fails: knowing whether the
      # failure is architecture-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      # Push to GHCR with the run's own GITHUB_TOKEN — no registry credential is
      # stored anywhere. No id-token here: only the merge job signs.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Labels land on the per-architecture images; the index annotations
          # are applied by the merge job.
          labels: ${{ needs.meta.outputs.labels }}
          # The Dockerfile declares both with placeholder defaults so a plain
          # `docker build` still produces an attributed image; CI supplies the
          # real values.
          build-args: |
            VERSION=${{ needs.meta.outputs.meta_version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture. A shared scope means the two legs overwrite
          # each other's entries and neither gets a reliable hit.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # The merge job needs both digests. Passing them as empty files named
      # after the digest keeps the artifact trivially mergeable.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge, tag and sign ────────────────────────────────────────────────────
  # The only job that creates something addressable by tag, and therefore the
  # only one that signs.
  merge:
    name: Build & Publish
    needs: [meta, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      # Lets the run mint the OIDC token cosign exchanges for a signing
      # certificate. Without it, keyless signing fails at the Fulcio call.
      id-token: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch index
        id: merge
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
          ANNOTATIONS: ${{ needs.meta.outputs.annotations }}
        run: |
          set -euo pipefail

          # metadata-action emits one tag and one annotation per line. Build the
          # argument list from them rather than interpolating, so a value
          # containing a space cannot split into two arguments.
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          while IFS= read -r ann; do
            [ -n "$ann" ] && args+=(--annotation "$ann")
          done <<< "$ANNOTATIONS"

          # Every file in this directory is named after a per-architecture digest.
          sources=()
          for f in *; do
            sources+=("${IMAGE}@sha256:${f}")
          done

          docker buildx imagetools create "${args[@]}" "${sources[@]}"

          # The tags all point at the same index; read the digest back from the
          # first of them so the signature covers what was actually published.
          first_tag=$(printf '%s\n' "$TAGS" | head -n1)
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ── Signing ──────────────────────────────────────────────────────────────
      # Keyless: cosign generates a throwaway keypair, exchanges the run's OIDC
      # token for a ten-minute certificate from Fulcio binding the public key to
      # this workflow's identity, then records the signature in the public Rekor
      # transparency log. Nothing is stored, so there is no signing key to leak
      # or rotate — and what a verifier learns is stronger than "someone signed
      # this": it is that this workflow, in this repository, produced these bytes.
      #
      # The digest is signed, not the tags. Tags move; a digest is the content.
      # Signing the index digest covers the multi-arch manifest as a whole.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        # --yes skips the confirmation prompt; there is no terminal here.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summarise what was published
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\` (signed)"
          } >> "$GITHUB_STEP_SUMMARY"
