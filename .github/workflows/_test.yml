name: Tests

# Reusable workflow: the test gate. Called by ci.yml on pull requests, and by
# publish.yml so an image cannot ship untested code.
on:
  workflow_call:
    inputs:
      # Set by ci.yml when a pull request changes only documentation. The skip
      # has to happen here rather than on the calling job: skip the caller and
      # this workflow never expands, so the required "Tests / Unit &
      # Integration" check never reports and the pull request cannot merge.
      # Skipped here, the job still reports, as skipped, which the ruleset
      # accepts. Defaults to running, so a caller that passes nothing tests.
      docs_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    # The name is part of a contract: the branch ruleset requires a check called
    # "Tests / Unit & Integration", so renaming this job stops that check ever
    # reporting and leaves every pull request unmergeable. Change it and the
    # ruleset together, or not at all — which is why it does not list the
    # component tier that runs below.
    name: Unit & Integration
    if: ${{ !inputs.docs_only }}
    runs-on: ubuntu-latest

    # The generated Prisma client lives in /generated/ (gitignored), so it must
    # be generated in CI. Integration tests override DATABASE_URL to an in-memory
    # SQLite DB (via vitest.config.ts); this file: URL only satisfies db:generate.
    env:
      DATABASE_URL: "file:./data/app.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Unit tests
        run: npx vitest run --project unit

      - name: Integration tests
        # Run even if an earlier step failed, so a red PR surfaces every tier's
        # results in one run rather than masking the later ones behind the first
        # failure.
        if: ${{ !cancelled() }}
        run: npx vitest run --project integration

      - name: Component tests
        if: ${{ !cancelled() }}
        run: npx vitest run --project component
