<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 66 376 376" role="img" aria-label="Vecta">
  <!--
    The Vecta mark, and the source of every icon: `npm run icons:generate`
    builds them all from this file. It is drawn flat, with no glow, and is
    always shown on the app's dark background.

    Coordinates are on a 474-unit canvas. The viewBox is the square the desktop
    icon shows, centred on the ring, so the logo sits in the app as it does on
    the icons.

    Each arc is drawn 7 units inside its outline and stroked 14 wide with round
    joins, which rounds its four corners to a 7-unit radius.
  -->
  <defs>
    <linearGradient id="vm-blue" gradientUnits="userSpaceOnUse" x1="165" y1="344" x2="318" y2="150">
      <stop offset="0" stop-color="#1048ff"/><stop offset=".5" stop-color="#0a8dff"/><stop offset="1" stop-color="#28c2ff"/>
    </linearGradient>
    <linearGradient id="vm-orange" gradientUnits="userSpaceOnUse" x1="382" y1="232" x2="250" y2="382">
      <stop offset="0" stop-color="#ffa000"/><stop offset=".45" stop-color="#ff8200"/><stop offset="1" stop-color="#ff5a0a"/>
    </linearGradient>
    <linearGradient id="vm-check" gradientUnits="userSpaceOnUse" x1="0" y1="181" x2="0" y2="340">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
  </defs>
  <path fill="url(#vm-blue)" stroke="url(#vm-blue)" stroke-width="14" stroke-linejoin="round" d="M158.2 351.6A134 134 0 0 1 316.5 137.7L306.1 155.9A113 113 0 0 0 172.6 336.3Z"/>
  <path fill="url(#vm-orange)" stroke="url(#vm-orange)" stroke-width="14" stroke-linejoin="round" d="M379.4 241.1A130 130 0 0 1 225.8 381.7L228.8 366A114 114 0 0 0 363.4 242.7Z"/>
  <path fill="url(#vm-check)" d="M323.5 182.7A5 5 0 0 1 327.2 181L369.5 181A5 5 0 0 1 373.2 189.4L243.5 329A15 15 0 0 1 221.2 328.7L166.8 266.1A14 14 0 0 1 177 242.9L202.4 242.1A6 6 0 0 1 206.8 243.9L236 273.9A4 4 0 0 0 241.9 273.8Z"/>
  <rect x="367" y="93" width="24" height="24" rx="4" fill="#ff8b01"/>
  <rect x="340" y="117" width="24" height="24" rx="4" fill="#ff9300"/>
  <rect x="394" y="131" width="21" height="21" rx="4" fill="#ff7800"/>
  <rect x="331" y="152" width="18" height="18" rx="4" fill="#ff8500"/>
  <rect x="362" y="153" width="19" height="19" rx="4" fill="#ff8401"/>
</svg>
